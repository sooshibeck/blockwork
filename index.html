.bw-splash{max-width:420px;margin:0 auto;padding:80px 24px;text-align:center;font-family:'Inter',system-ui,sans-serif;color:var(--ink-soft);font-size:15px;line-height:1.6;}
.bw-splash code{font-family:ui-monospace,monospace;font-size:13px;background:#FDE7E9;color:var(--pine-deep);padding:1px 6px;border-radius:5px;}
.bw-controls{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;margin-bottom:22px;}
.bw-controls-row{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;}
.bw-field{display:flex;flex-direction:column;gap:6px;}
.bw-field-label{font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink-soft);}
.bw-select{font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:150px;cursor:pointer;}
.bw-select:focus-visible{outline:2px solid var(--pine);outline-offset:1px;}
.bw-segment{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.bw-seg-btn{font-family:inherit;font-size:13.5px;font-weight:500;padding:9px 13px;background:var(--paper);color:var(--ink-soft);border:none;cursor:pointer;border-right:1px solid var(--line);}
.bw-seg-btn:last-child{border-right:none;}
.bw-seg-btn.is-active{background:var(--pine);color:#fff;}
.bw-segment.is-disabled{opacity:.4;}
.bw-seg-btn:disabled{cursor:not-allowed;}
.bw-blocks-toggle{font-family:inherit;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:9px;cursor:pointer;margin-left:auto;align-self:flex-end;}
.bw-blocks-count{color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.bw-blocks-panel{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
.bw-panel-label{font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 9px;}
.bw-panel-head{display:flex;align-items:baseline;justify-content:space-between;margin-top:16px;}
.bw-chipgroup{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
.bw-chipgroup>.bw-panel-head{margin-top:0;}
.bw-chip-count{font-size:10.5px;color:var(--ink-soft);letter-spacing:0;text-transform:none;font-weight:400;margin-left:4px;}
.bw-blocks-panel>.bw-panel-head:first-child{margin-top:0;}
.bw-blocks-actions{font-size:12.5px;}
.bw-text-btn{font-family:inherit;font-size:12.5px;color:var(--pine);background:none;border:none;cursor:pointer;padding:0;font-weight:500;}
.bw-dot-sep{color:var(--line);margin:0 8px;}
.bw-chips{display:flex;flex-wrap:wrap;gap:7px;}
.bw-chip{font-family:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);}
.bw-chip.is-on{background:#FDE7E9;color:var(--pine-deep);border-color:#F5CBCF;}
.bw-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}
.bw-generate{font-family:inherit;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:9px;padding:13px 22px;border-radius:11px;cursor:pointer;background:var(--pine);color:#fff;border:none;box-shadow:0 1px 0 var(--pine-deep);transition:background .15s ease,transform .05s ease;}
.bw-generate:hover{background:var(--pine-deep);}
.bw-generate:active{transform:translateY(1px);}
.bw-generate:disabled{opacity:.45;cursor:not-allowed;}
.bw-print{font-family:inherit;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;padding:13px 16px;border-radius:11px;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--line);}
.bw-print:disabled{opacity:.4;cursor:not-allowed;}
.bw-save-row{display:flex;gap:8px;align-items:center;margin-top:12px;}
.bw-name-input{flex:1;min-width:0;font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px 12px;}
.bw-name-input:focus-visible{outline:2px solid var(--pine);outline-offset:1px;}
.bw-name-save{font-family:inherit;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:9px;cursor:pointer;background:var(--pine);color:#fff;border:none;}
.bw-name-save:disabled{opacity:.5;cursor:not-allowed;}
.bw-history{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;}
.bw-history-empty{margin:0;padding:16px;font-size:13.5px;color:var(--ink-soft);}
.bw-history-list{list-style:none;margin:0;padding:0;}
.bw-history-item{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-top:1px solid var(--line);}
.bw-history-item:first-child{border-top:none;}
.bw-history-load{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:none;cursor:pointer;padding:10px 12px;border-radius:8px;font-family:inherit;}
.bw-history-load:hover{background:var(--paper);}
.bw-history-title{font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bw-history-sub{font-size:12px;color:var(--ink-soft);}
.bw-generate:focus-visible,.bw-print:focus-visible,.bw-blocks-toggle:focus-visible,.bw-icon-btn:focus-visible,.bw-chip:focus-visible,.bw-seg-btn:focus-visible{outline:2px solid var(--ochre);outline-offset:2px;}
.bw-meta{margin-bottom:18px;}
.bw-meta-print-title{display:none;}
.bw-meta-grid{display:flex;flex-wrap:wrap;gap:0;margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);}
.bw-meta-grid>div{flex:1;min-width:90px;padding:11px 14px;border-right:1px solid var(--line);}
.bw-meta-grid>div:last-child{border-right:none;}
.bw-meta-grid dt{font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:3px;}
.bw-meta-grid dd{margin:0;font-size:14px;font-weight:500;color:var(--ink);}
.bw-spine{position:relative;}
.bw-block{display:flex;gap:16px;position:relative;animation:bwIn .4s ease both;}
@keyframes bwIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.bw-rail{position:relative;flex:0 0 36px;display:flex;justify-content:center;}
.bw-rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1.5px;background:var(--line);transform:translateX(-50%);}
.bw-block:first-child .bw-rail::before{top:18px;}
.bw-block:last-child .bw-rail::before{bottom:calc(100% - 18px);}
.bw-node{position:relative;z-index:1;margin-top:8px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:13px;font-weight:600;background:var(--surface);color:var(--pine);border:1.5px solid var(--sage);font-variant-numeric:tabular-nums;}
.bw-card{flex:1;min-width:0;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px 15px;}
.bw-card.is-locked{border-color:var(--ochre-soft);background:#FEFCF8;}
.bw-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.bw-card-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.bw-block-name{font-family:'Fraunces',serif;font-weight:500;font-size:16.5px;margin:0;color:var(--pine-deep);}
.bw-rec{font-size:11px;color:var(--ink-soft);letter-spacing:0.02em;}
.bw-equip{font-size:11px;font-weight:600;color:var(--pine-deep);background:#FDE7E9;border:1px solid #F5CBCF;padding:2px 9px;border-radius:999px;letter-spacing:0.02em;}
.bw-equip.is-switch{color:var(--ochre);background:#FBF1E2;border-color:var(--ochre-soft);}
.bw-card-tools{display:flex;gap:4px;}
.bw-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;cursor:pointer;background:transparent;color:var(--ink-soft);border:1px solid transparent;}
.bw-icon-btn:hover{background:var(--paper);color:var(--ink);}
.bw-icon-btn.is-on{color:var(--ochre);}
.bw-units{margin-top:10px;display:flex;flex-direction:column;gap:2px;}
.bw-ex{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding:7px 0;border-top:1px solid var(--line);}
.bw-units>.bw-ex:first-child{border-top:none;padding-top:2px;}
.bw-ex-name{font-size:15px;font-weight:500;color:var(--ink);}
.bw-ex-meta{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto;}
.bw-tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#FDE7E9;color:var(--pine-deep);white-space:nowrap;}
.bw-tag-quiet{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);}
.bw-tag-series{background:#FBF1E2;color:var(--ochre);border:1px solid var(--ochre-soft);}
.bw-tag-page{background:#EEF1F4;color:#4A5A66;border:1px solid #DCE2E7;font-variant-numeric:tabular-nums;}
.bw-card-empty{margin:10px 0 2px;font-size:13px;color:var(--ink-soft);font-style:italic;}
.bw-series{padding:10px 0;border-top:1px solid var(--line);}
.bw-units>.bw-series:first-child{border-top:none;padding-top:2px;}
.bw-series-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--ochre);}
.bw-series-name{font-size:15px;font-weight:600;color:var(--ink);}
.bw-series-list{margin:8px 0 0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:3px;}
.bw-series-list li{font-size:13.5px;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.bw-series-pg{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
.bw-empty{display:flex;gap:22px;align-items:center;padding:30px 6px;}
.bw-empty-spine{display:flex;flex-direction:column;gap:11px;}
.bw-empty-node{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);}
.bw-empty-text{font-size:14.5px;color:var(--ink-soft);line-height:1.6;}
.bw-footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-soft);line-height:1.6;display:flex;flex-direction:column;gap:2px;}
.bw-footer-credit{font-weight:600;color:var(--pine);font-size:12.5px;}
.bw-footer-note{color:var(--ink-soft);}
@media (max-width:480px){.bw-root{padding:22px 14px 50px;}.bw-blocks-toggle{margin-left:0;}.bw-ex-meta{margin-left:0;width:100%;}}
@media print{.no-print{display:none!important;}.bw-root{max-width:none;padding:0;background:#fff;}.bw-meta-print-title{display:block;margin-bottom:12px;}.bw-meta-print-title h2{font-family:'Fraunces',serif;font-size:22px;margin:0;}.bw-block{animation:none;break-inside:avoid;}.bw-card,.bw-controls{box-shadow:none;}}
@media (prefers-reduced-motion:reduce){.bw-block{animation:none;}}
`;
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
